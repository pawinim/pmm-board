// ── Storage + render ──────────────────────────────────────────────────
function load(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}catch{return{}}}
function save(s){try{localStorage.setItem(STORE_KEY,JSON.stringify(s))}catch{}}

function ts(){return new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}

function render(){
  const state=load();
  const panes={u:[],h:[],m:[],d:[]};
  INCOMING.forEach(card=>{
    const done=state[card.id];
    const c=document.createElement('div');
    c.className='card '+card.p+(done?' done-card':'');
    c.innerHTML=`
      <div class="card-header">
        <div class="cb ${done?'checked':''}" onclick="toggle('${card.id}',event)"></div>
        <div class="card-body">
          <div class="card-label">${card.label}</div>
          <div class="card-title">${card.title}</div>
          <div class="card-note">${card.note}</div>
          <div class="tags">${(card.tags||[]).map(t=>`<span class="tag ${t.c}">${t.t}</span>`).join('')}
            ${card.owners?`<span class="tag tn">${card.owners}</span>`:''}
          </div>
          ${done?`<div class="done-stamp">✓ done ${state[card.id+'_ts']||''}</div>`:''}
        </div>
      </div>`;
    if(card.url) c.addEventListener('click',e=>{if(!e.target.classList.contains('cb'))window.open(card.url,'_blank')});
    if(done) panes.d.push(c); else panes[card.p].push(c);
  });
  ['u','h','m','d'].forEach(p=>{
    const el=document.getElementById('pane-'+p);
    el.innerHTML='';
    if(panes[p].length===0){
      el.innerHTML=`<div style="color:#444;font-size:13px;padding:20px 0;font-family:'DM Mono',monospace">Nothing here.</div>`;
    } else {
      panes[p].forEach(c=>el.appendChild(c));
    }
    document.getElementById('cnt-'+p).textContent=panes[p].length;
  });
}

function toggle(id,e){
  e.stopPropagation();
  const state=load();
  if(state[id]){delete state[id];delete state[id+'_ts'];}
  else{state[id]=true;state[id+'_ts']=ts();}
  save(state);render();
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(el=>el.classList.remove('active'));
  document.querySelector('.tab.'+t).classList.add('active');
  document.getElementById('pane-'+t).classList.add('active');
}

function clearDone(){
  if(!confirm('Clear all completed items?'))return;
  const state=load();
  INCOMING.forEach(c=>{delete state[c.id];delete state[c.id+'_ts'];});
  save(state);render();
}
